[package]
name = "ad-auction-lab-rs"
version = "0.1.0"
edition = "2024"
description = "Rust core of ad-auction-lab: hashed CTR models (FTRL-Proximal logistic regression, factorization machine) and the budget pacing simulator"
license = "MIT"
authors = ["Adeolu Ogunnoiki"]
repository = "https://github.com/adeoluo/ad-auction-lab"
publish = false

[lib]
name = "ad_auction_lab_rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Enabled by maturin (see pyproject.toml). Plain `cargo test` builds the core without Python.
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30.1", optional = true, features = ["abi3-py312"] }
rayon = "1.12"

[profile.release]
lto = true
codegen-units = 1
