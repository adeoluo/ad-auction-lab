[project]
name = "ad-auction-lab"
version = "0.1.0"
description = "Ad auctions, bid shading, budget pacing, hashed CTR models and off-policy evaluation, measured on Criteo and the Open Bandit Dataset"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Adeolu Ogunnoiki" }]
dependencies = [
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.14",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
]
# Rebuild the Rust core in place while editing it: make rust-develop
rust = [
    "maturin>=1.7,<2",
]
# Reference libraries for comparison benchmarks and opt-in parity tests. obp pins old scipy and
# numpy releases, so `make validation` installs it with --no-deps on top of this group.
validation = [
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "pandas>=2.0",
    "torch>=2.2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "pyyaml>=6.0",
]

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

# The Rust core (rust/) is compiled into the package as `ad_auction_lab.ad_auction_lab_rs`,
# so every install uses it; the numpy implementations stay as the reference.
[tool.maturin]
python-source = "src"
manifest-path = "rust/Cargo.toml"
module-name = "ad_auction_lab.ad_auction_lab_rs"
features = ["python"]

[tool.uv]
# Rebuild the extension when the Rust sources change.
cache-keys = [{ file = "pyproject.toml" }, { file = "rust/Cargo.toml" }, { file = "rust/src/**/*.rs" }]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Mathematical names (X for a feature matrix) follow the usual notation.
"**/*.py" = ["N803", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["ad_auction_lab"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = false
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "ad_auction_lab.ad_auction_lab_rs",
    "obp.*",
    "sklearn.*",
    "scipy.*",
    "pandas.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra -q -p no:cacheprovider --basetemp=.pytest-tmp"
markers = [
    "slow: larger-scale tests",
    "validation: comparisons with reference libraries (uv sync --group validation)",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true
